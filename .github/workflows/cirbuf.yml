name: cirbuf CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Build
        run: make

      - name: Check formatting
        run: |
          clang-format --style=Microsoft --dry-run --Werror cirbuf.c cirbuf.h
